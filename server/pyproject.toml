[project]
name = "srcly"
version = "1.8.0"
description = "Interactive codebase treemap and metrics viewer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.3",
    "lizard>=1.21.7",
    "pydantic>=2.12.4",
    "pytest>=9.0.1",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-markdown>=0.5.1,<0.6.0",
    "tree-sitter-css==0.25.0",
    "tree-sitter-scss==1.0.0",
    "tree-sitter-python==0.25.0",
    "uvicorn>=0.38.0",
    "pathspec>=0.12.1",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
    "mypy>=1.18",
]

[project.scripts]
srcly = "app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "ruff>=0.17.1",
]

[tool.hatch.build]
include = [
    "app/**",
]
# The engine bundle carries its own TypeScript in node_modules, which the
# repository's .gitignore would otherwise drop (build-srcly.sh writes it).
artifacts = [
    "app/engine/**",
]

[tool.ruff]
extend-exclude = ["app/static", "app/engine"]

[tool.ruff.lint]
# Pyflakes only: unused imports, undefined names, dead f-strings.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as test parameters.
"tests/**" = ["F811"]
