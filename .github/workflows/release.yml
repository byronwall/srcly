name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            engine/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("server/pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match the package version"
          PY
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Typecheck client
        working-directory: client
        run: pnpm typecheck
      - name: Test client
        working-directory: client
        run: pnpm test
      - name: Install engine dependencies
        working-directory: engine
        run: pnpm install --frozen-lockfile
      - name: Typecheck engine
        working-directory: engine
        run: pnpm typecheck
      - name: Lint engine
        working-directory: engine
        run: pnpm lint
      - name: Install server dependencies (the engine's Python tests use its mypy)
        working-directory: server
        run: uv sync --locked
      - name: Test engine
        working-directory: engine
        run: pnpm test
      - name: Lint server
        working-directory: server
        run: uv run --locked ruff check
      - name: Test server
        working-directory: server
        run: uv run --locked pytest
      - name: Build client and Python package
        run: bash build-srcly.sh
      - name: Test installed wheel
        run: uv run --no-project --python 3.13 --with ./server/dist/srcly-*.whl pytest scripts/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: server/dist/*

  # Data flow smoke in a real browser: the engine on examples/solid-route
  # through the API and the client (client/e2e). Stays under 3 minutes.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            engine/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Install engine dependencies
        working-directory: engine
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: client
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataflow-smoke
          path: |
            tmp/e2e/*.png
            tmp/e2e/results
            tmp/e2e/report
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: Attach distributions to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
