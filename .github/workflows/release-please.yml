name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ github.token }}
      # PR workflows started by GITHUB_TOKEN wait for approval, and branch protection
      # only counts runs linked to the PR, so approve the release PR's own runs.
      - name: Approve release PR checks
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            // PR title, Release and Survey each start one pull_request run.
            const expected = 3;
            for (const pr of JSON.parse(process.env.RELEASE_PRS || '[]')) {
              const approved = new Set();
              for (let attempt = 0; attempt < 18 && approved.size < expected; attempt++) {
                const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                  ...context.repo, branch: pr.headBranchName, event: 'pull_request',
                  status: 'action_required', per_page: 20,
                });
                for (const run of data.workflow_runs) {
                  if (approved.has(run.id)) continue;
                  try {
                    await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                      ...context.repo, run_id: run.id,
                    });
                    approved.add(run.id);
                    core.info(`Approved ${run.name} (${run.id}) for PR #${pr.number}`);
                  } catch (error) {
                    core.warning(`Could not approve ${run.name} (${run.id}): ${error.message}. ` +
                      `Approve it with: gh api -X POST repos/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/approve`);
                    approved.add(run.id);
                  }
                }
                if (approved.size < expected) await new Promise((r) => setTimeout(r, 10000));
              }
              if (approved.size < expected) {
                core.warning(`PR #${pr.number}: found ${approved.size} of ${expected} waiting runs. See docs/releases.md.`);
              }
            }
      # GITHUB_TOKEN does not start tag workflows. An explicit dispatch does.
      - name: Start publication
        if: steps.release.outputs.release_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: process.env.RELEASE_TAG,
            });
